spring.application.name=backend
# Server Port
server.port=8080

# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/dr_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Driver & Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Settings (Auto-Create Tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Ye ek lamba secret key hai (aap isko kuch bhi lamba string rakh sakte hain)
dr.app.jwtSecret=MySuperSecretKeyForDrBackendApplicationWhichIsVeryLongAndSecure12345
# Token ki expiry (Yahan 86400000 milliseconds = 24 ghante rakha hai)
dr.app.jwtExpirationMs=86400000